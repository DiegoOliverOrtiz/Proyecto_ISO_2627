<main class="pagina formulario-pagina">
  <header class="pagina-cabecera">
    <div>
      <h1 class="pagina-titulo">Añadir administrador</h1>
      <p class="pagina-descripcion">Registra a un nuevo responsable de la plataforma.</p>
    </div>
    <a class="boton-secundario" routerLink="/admin/administradores">Volver al listado</a>
  </header>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="tarjeta admin-form" autocomplete="off">
        @if (mensajeError()) {
          <div class="aviso aviso-error" role="alert">{{ mensajeError() }}</div>
        }

        <div class="form-grid">
          <label class="field">
            <span>Nombre</span>
            <input type="text" formControlName="nombre" autocomplete="off" />
            @if (controlError('nombre'); as error) {
              <small class="field-error">{{ error }}</small>
            }
          </label>

          <label class="field">
            <span>Apellidos</span>
            <input type="text" formControlName="apellidos" autocomplete="off" />
            @if (controlError('apellidos'); as error) {
              <small class="field-error">{{ error }}</small>
            }
          </label>

          <label class="field field-wide">
            <span>Correo electrónico (Será su acceso)</span>
            <input type="email" formControlName="email" autocomplete="off" />
            @if (controlError('email'); as error) {
              <small class="field-error">{{ error }}</small>
            }
          </label>

          <label class="field">
            <span>Sede <em>Opcional</em></span>
            <input type="text" formControlName="sede" autocomplete="off" />
          </label>

          <label class="field">
            <span>URL Imagen de perfil <em>Opcional</em></span>
            <input type="url" formControlName="imagenPerfil" placeholder="https://..." autocomplete="off" />
          </label>

          <div class="field-wide" ></div>

          <label class="field">
            <span>Contraseña</span>
            <div class="password-container">
              @if (hidePassword) {
                <input 
                  type="password" 
                  formControlName="contrasena" 
                  autocomplete="new-password"
                  (focus)="passwordFocused = true"
                  (blur)="passwordFocused = !!form.controls.contrasena.value"
                />
              } @else {
                <input 
                  type="text" 
                  formControlName="contrasena" 
                  autocomplete="off"
                  (focus)="passwordFocused = true"
                  (blur)="passwordFocused = !!form.controls.contrasena.value"
                />
              }
              <button type="button" (click)="togglePassword()" class="boton-ojo" [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="!hidePassword">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">@if (hidePassword) {<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>} @else {<path d="M3 3l18 18"></path><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>}</svg>
              </button>
            </div>
            
            @if (passwordFocused) {
              <div class="password-requirements" aria-live="polite">
                <strong>Requisitos:</strong>
                <ul>
                  @for (requirement of passwordRequirements(); track requirement.label) {
                    <li [class.met]="requirement.met">
                      <span class="requirement-status" aria-hidden="true">{{ requirement.met ? '✓' : '×' }}</span>
                      <span>{{ requirement.label }}</span>
                    </li>
                  }
                </ul>
              </div>
            }

            @if (controlError('contrasena'); as error) {
              <small class="field-error">{{ error }}</small>
            }
          </label>

          <label class="field">
            <span>Repetir contraseña</span>
            <div class="password-container">
              @if (hideRepeatPassword) {
                <input type="password" formControlName="repetirContrasena" autocomplete="new-password" />
              } @else {
                <input type="text" formControlName="repetirContrasena" autocomplete="off" />
              }
              <button type="button" (click)="toggleRepeatPassword()" class="boton-ojo" [attr.aria-label]="hideRepeatPassword ? 'Mostrar contraseña' : 'Ocultar contraseña'" [attr.aria-pressed]="!hideRepeatPassword">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">@if (hideRepeatPassword) {<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>} @else {<path d="M3 3l18 18"></path><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"></path><path d="M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>}</svg>
              </button>
            </div>
            
            @if (controlError('repetirContrasena'); as error) {
              <small class="field-error">{{ error }}</small>
            }
            @if (passwordMismatch()) {
              <small class="field-error">Las contraseñas no coinciden.</small>
            }
          </label>
        </div>

        <button type="submit" class="boton-principal submit-button" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Creando cuenta...' : 'Crear administrador' }}
        </button>
      </form>
</main>
