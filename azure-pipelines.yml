# Azure Pipelines Configuration - ESIBuy
# Pipeline as Code: Validación automática en cada push
# El análisis de seguridad (CodeQL) se ejecuta en GitHub Actions: .github/workflows/codeql.yml
# SonarQube se ejecuta de forma manual en local (no forma parte de esta pipeline)

trigger:
  branches:
    include:
    - main                 # Rama de producción
    - develop             # Rama de integración
    - feature/*           # Ramas de nuevas features (HU)
    - hotfix/*            # Ramas de correcciones urgentes
  paths:
    exclude:
    - README.md           # Ignore documentación
    - docs/**             # Ignore carpeta de docs

# Pull requests hacia las ramas de integración y estables
pr:
  branches:
    include:
    - main
    - develop
    - feature/*

pool:
  name: Default             # Agente propio (WSL Ubuntu); ver documents/sprint2/instruccionesCI-CD.md

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
  NODE_VERSION: '22.x'
stages:

# ========== STAGE 1: BUILD BACKEND ==========
- stage: BuildBackend
  displayName: 'Build & Test Backend'
  jobs:
  - job: MavenBuild
    displayName: 'Maven Compile & Tests'
    steps:

    # Paso 1: Comprobar Java 21 (instalado en el agente propio; JavaToolInstaller@0 exigiría JAVA_HOME_21_X64)
    - script: |
        java -version
        java -version 2>&1 | grep -q '"21' || { echo "##vso[task.logissue type=error]Se requiere Java 21 en el agente"; exit 1; }
      displayName: 'Comprobar Java 21'

    # Paso 2: Cache Maven (acelera builds posteriores)
    - task: Cache@2
      inputs:
        key: 'maven | "$(Agent.OS)" | backend/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(MAVEN_CACHE_FOLDER)
      displayName: 'Cache Maven dependencies'

    # Paso 3: Compilación + tests + informe JaCoCo (el pom.xml aún no define umbral de cobertura)
    # BackendApplicationTests (@SpringBootTest) necesita conexión a MongoDB, por eso se excluye en CI
    - script: |
        chmod +x mvnw
        ./mvnw -B clean verify \
          -Dtest='!BackendApplicationTests' \
          -Dsurefire.failIfNoSpecifiedTests=false
      workingDirectory: backend
      displayName: 'Maven Build (Compile + JUnit + Coverage report)'

    # Paso 4: Publicar resultados de tests
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/target/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
      displayName: 'Publish JUnit Test Results'
      condition: always()

    # Paso 5: Publicar reporte de cobertura
    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/target/site/jacoco/jacoco.xml'
      displayName: 'Publish JaCoCo Coverage Report'
      condition: always()

    # Paso 6: Análisis de dependencias del backend (falla con CVSS >= 9, severidad crítica).
    # NVD_API_KEY: variable secreta; la base de datos de vulnerabilidades se cachea entre ejecuciones.
    - task: Cache@2
      inputs:
        key: 'dependency-check | "$(Agent.OS)" | "$(Build.BuildNumber)"'
        restoreKeys: |
          dependency-check | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/dependency-check-data
      displayName: 'Cache base de datos NVD'

    - script: |
        for variable in SONATYPE_USERNAME SONATYPE_TOKEN; do
          case "${!variable}" in
            ''|'$('* )
              echo "##vso[task.logissue type=error]Configura la variable secreta $variable en Azure Pipelines."
              exit 1
              ;;
          esac
        done
        ./mvnw -B --settings .mvn/dependency-check-settings.xml \
          org.owasp:dependency-check-maven:12.1.3:check \
          -DdataDirectory="$(Pipeline.Workspace)/dependency-check-data"
      workingDirectory: backend
      displayName: 'OWASP Dependency-Check (backend)'
      env:
        NVD_API_KEY: $(NVD_API_KEY)
        SONATYPE_USERNAME: $(SONATYPE_USERNAME)
        SONATYPE_TOKEN: $(SONATYPE_TOKEN)

    # Paso 7: Publicar artefacto (JAR compilado)
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/backend/target/backend-0.0.1-SNAPSHOT.jar'
        artifact: 'backend-jar'
      displayName: 'Publish Backend JAR'
      condition: succeeded()

# ========== STAGE 2: BUILD FRONTEND ==========
# Independiente del backend: se ejecuta en paralelo
- stage: BuildFrontend
  displayName: 'Build & Test Frontend'
  dependsOn: []
  jobs:
  - job: NPMBuild
    displayName: 'Angular Build & Tests'
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js'

    - script: npm ci
      workingDirectory: frontend
      displayName: 'npm install (clean)'

    # Falla ante dependencias con severidad crítica (requisito: 0 vulnerabilidades críticas/bloqueantes)
    - script: npm audit --audit-level=critical
      workingDirectory: frontend
      displayName: 'npm audit (dependencias, umbral crítico)'

    # Cobertura mínima 60 % (statements y lines) definida en angular.json: falla si no se alcanza
    - script: npm test -- --watch=false --coverage
      workingDirectory: frontend
      displayName: 'npm test (Vitest + cobertura ≥60%)'

    - script: npm run build
      workingDirectory: frontend
      displayName: 'npm build (production)'
# ========== STAGE 3: ESCÁNER DE SECRETOS ==========
# Gestión de secretos: el repositorio no debe contener credenciales ni claves.
# --no-git analiza los ficheros versionados del commit; el historial (credenciales ya expuestas)
# se revisará tras rotarlas.
- stage: SecretScan
  displayName: 'Secret Scan'
  dependsOn: []
  jobs:
  - job: Gitleaks
    displayName: 'Gitleaks'
    steps:
    - script: |
        docker run --rm -v "$(Build.SourcesDirectory):/repo" \
          ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --verbose
      displayName: 'Gitleaks (secretos en el repositorio)'

# ========== FINAL NOTIFICATION ==========
- stage: Notification
  displayName: 'Pipeline Complete'
  dependsOn: [BuildBackend, BuildFrontend, SecretScan]
  condition: always()
  jobs:
  - job: NotifyOk
    displayName: 'Pipeline OK'
    condition: and(eq(stageDependencies.BuildBackend.MavenBuild.result, 'Succeeded'), eq(stageDependencies.BuildFrontend.NPMBuild.result, 'Succeeded'), eq(stageDependencies.SecretScan.Gitleaks.result, 'Succeeded'))
    steps:
    - script: echo "##[section]✅ PIPELINE PASSED - All checks green"
      displayName: 'Summary'
  - job: NotifyFail
    displayName: 'Pipeline FAILED'
    condition: or(ne(stageDependencies.BuildBackend.MavenBuild.result, 'Succeeded'), ne(stageDependencies.BuildFrontend.NPMBuild.result, 'Succeeded'), ne(stageDependencies.SecretScan.Gitleaks.result, 'Succeeded'))
    steps:
    - script: echo "##[error]❌ PIPELINE FAILED - See logs above"
      displayName: 'Summary'
