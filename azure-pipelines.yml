# Azure Pipelines Configuration - ESIBuy
# Validación automática al integrar en main y develop, y en las ramas release/*.
# release/* se incluye porque Render despliega release/sprint2 solo tras pasar el CI
# («After CI Checks Pass»); sin pipeline en esa rama no hay checks que esperar.
# Los push a feature/* no lanzan la pipeline.
# CodeQL se ejecuta en GitHub Actions: .github/workflows/codeql.yml
# SonarScanner utiliza el sonar-project.properties de cada carpeta.
# Configurar SQ_TOKEN como variable secreta con acceso a ambos proyectos.

trigger:
  branches:
    include:
    - main
    - develop
    - release/*
  paths:
    exclude:
    - README.md
    - docs/**

pr:
  branches:
    include:
    - main
    - develop
    - release/*

pool:
  name: Default

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
  NODE_VERSION: '22.x'

stages:

# ========== STAGE 1: BUILD BACKEND ==========
- stage: BuildBackend
  displayName: 'Build & Test Backend'
  jobs:
  - job: MavenBuild
    displayName: 'Maven Compile & Tests'
    steps:

    - script: |
        java -version
        java -version 2>&1 | grep -q '"21' || { echo "##vso[task.logissue type=error]Se requiere Java 21 en el agente"; exit 1; }
      displayName: 'Comprobar Java 21'

    - task: Cache@2
      inputs:
        key: 'maven | "$(Agent.OS)" | backend/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(MAVEN_CACHE_FOLDER)
      displayName: 'Cache Maven dependencies'

    # Compilación, tests e informe JaCoCo.
    # BackendApplicationTests necesita MongoDB y se mantiene excluido.
    - script: |
        chmod +x mvnw
        ./mvnw -B clean verify \
          -Dtest='!BackendApplicationTests' \
          -Dsurefire.failIfNoSpecifiedTests=false
      workingDirectory: backend
      displayName: 'Maven Build (Compile + JUnit + Coverage report)'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/target/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
      displayName: 'Publish JUnit Test Results'
      condition: always()

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/target/site/jacoco/jacoco.xml'
      displayName: 'Publish JaCoCo Coverage Report'
      condition: always()

    # Análisis de dependencias del backend.
    - task: Cache@2
      inputs:
        key: 'dependency-check | "$(Agent.OS)" | "$(Build.BuildNumber)"'
        restoreKeys: |
          dependency-check | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/dependency-check-data
      displayName: 'Cache base de datos NVD'

    - script: |
        for variable in SONATYPE_USERNAME SONATYPE_TOKEN; do
          case "${!variable}" in
            ''|'$('* )
              echo "##vso[task.logissue type=error]Configura la variable secreta $variable en Azure Pipelines."
              exit 1
              ;;
          esac
        done
        ./mvnw -B --settings .mvn/dependency-check-settings.xml \
          org.owasp:dependency-check-maven:12.1.3:check \
          -DdataDirectory="$(Pipeline.Workspace)/dependency-check-data"
      workingDirectory: backend
      displayName: 'OWASP Dependency-Check (backend)'
      env:
        NVD_API_KEY: $(NVD_API_KEY)
        SONATYPE_USERNAME: $(SONATYPE_USERNAME)
        SONATYPE_TOKEN: $(SONATYPE_TOKEN)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/backend/target/backend-0.0.1-SNAPSHOT.jar'
        artifact: 'backend-jar'
      displayName: 'Publish Backend JAR'
      condition: succeeded()

    # Guardar las clases y JaCoCo para la fase de SonarQube.
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/backend/target'
        artifact: 'backend-sonar'
      displayName: 'Publicar clases Java y JaCoCo'

# ========== STAGE 2: BUILD FRONTEND ==========
- stage: BuildFrontend
  displayName: 'Build & Test Frontend'
  dependsOn: []
  jobs:
  - job: NPMBuild
    displayName: 'Angular Build & Tests'
    steps:

    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js'

    - script: npm ci
      workingDirectory: frontend
      displayName: 'npm install (clean)'

    - script: npm audit --audit-level=critical
      workingDirectory: frontend
      displayName: 'npm audit (dependencias, umbral crítico)'

    # Mantiene los umbrales de cobertura de angular.json.
    - script: npm test -- --watch=false --coverage
      workingDirectory: frontend
      displayName: 'npm test (Vitest + cobertura ≥60%)'

    - script: npm run build
      workingDirectory: frontend
      displayName: 'npm build (production)'

# ========== STAGE 3: ESCÁNER DE SECRETOS ==========
- stage: SecretScan
  displayName: 'Secret Scan'
  dependsOn: []
  jobs:
  - job: Gitleaks
    displayName: 'Gitleaks'
    steps:

    - script: |
        docker run --rm -v "$(Build.SourcesDirectory):/repo" \
          ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --verbose
      displayName: 'Gitleaks (secretos en el repositorio)'

# ========== STAGE 4: SONARQUBE ==========
- stage: Sonarqube
  displayName: 'SonarQube Code Analysis'
  dependsOn: [BuildBackend, BuildFrontend, SecretScan]
  condition: succeeded()
  jobs:
  - job: SonarqubeJob
    displayName: 'SonarQube - Backend y Frontend'
    steps:

    - checkout: self
      fetchDepth: 0

    # Recuperar las clases y JaCoCo generados por BuildBackend.
    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'backend-sonar'
        targetPath: '$(System.DefaultWorkingDirectory)/backend/target'
      displayName: 'Descargar clases Java y JaCoCo'

    - script: sonar-scanner
      workingDirectory: backend
      displayName: 'Analizar Backend'
      env:
        SONAR_TOKEN: $(SQ_TOKEN)

    - script: sonar-scanner
      workingDirectory: frontend
      displayName: 'Analizar Frontend'
      env:
        SONAR_TOKEN: $(SQ_TOKEN)

# ========== FINAL NOTIFICATION ==========
- stage: Notification
  displayName: 'Pipeline Complete'
  dependsOn: [BuildBackend, BuildFrontend, SecretScan, Sonarqube]
  condition: always()
  jobs:

  - job: NotifyOk
    displayName: 'Pipeline OK'
    condition: |
      and(
        not(canceled()),
        eq(stageDependencies.BuildBackend.MavenBuild.result, 'Succeeded'),
        eq(stageDependencies.BuildFrontend.NPMBuild.result, 'Succeeded'),
        eq(stageDependencies.SecretScan.Gitleaks.result, 'Succeeded'),
        eq(stageDependencies.Sonarqube.SonarqubeJob.result, 'Succeeded')
      )
    steps:
    - script: |
        echo "##[section]PIPELINE OK - Builds, tests, secretos y envío a SonarQube completados."
        echo "Consulta en SonarQube el resultado del Quality Gate de cada proyecto."
      displayName: 'Summary'

  - job: NotifyFail
    displayName: 'Pipeline con errores o incompleta'
    condition: |
      and(
        not(canceled()),
        or(
          ne(stageDependencies.BuildBackend.MavenBuild.result, 'Succeeded'),
          ne(stageDependencies.BuildFrontend.NPMBuild.result, 'Succeeded'),
          ne(stageDependencies.SecretScan.Gitleaks.result, 'Succeeded'),
          ne(stageDependencies.Sonarqube.SonarqubeJob.result, 'Succeeded')
        )
      )
    steps:
    - script: |
        echo "##[error]PIPELINE CON ERRORES O INCOMPLETA - Revisa las fases anteriores."
        exit 1
      displayName: 'Summary'