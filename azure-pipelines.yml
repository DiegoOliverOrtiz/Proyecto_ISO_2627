# Azure Pipelines Configuration - ESIBuy
# CI: push a main/develop y validación de PR hacia main/develop.
# CodeQL se ejecuta en GitHub Actions: .github/workflows/codeql.yml
# SonarQube analiza Backend y Frontend como dos proyectos existentes.
# Tanto main como develop ejecutan ambos análisis (Community: comparten historial por proyecto).

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    exclude:
      - README.md
      - docs/**

pr:
  branches:
    include:
      - main
      - develop

pool:
  name: Default

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
  NODE_VERSION: '22.x'

stages:
# ========== STAGE 1: BUILD BACKEND ==========
- stage: BuildBackend
  displayName: 'Build & Test Backend'
  jobs:
  - job: MavenBuild
    displayName: 'Maven Compile & Tests'
    steps:
    - script: |
        java -version
        java -version 2>&1 | grep -q '"21' || { echo "##vso[task.logissue type=error]Se requiere Java 21 en el agente"; exit 1; }
      displayName: 'Comprobar Java 21'

    - task: Cache@2
      inputs:
        key: 'maven | "$(Agent.OS)" | backend/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(MAVEN_CACHE_FOLDER)
      displayName: 'Cache Maven dependencies'

    # BackendApplicationTests necesita MongoDB: se omite en CI.
    - script: |
        chmod +x mvnw
        ./mvnw -B clean verify \
          -Dtest='!BackendApplicationTests' \
          -Dsurefire.failIfNoSpecifiedTests=false
      workingDirectory: backend
      displayName: 'Maven Build (Compile + JUnit + Coverage report)'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'backend/target/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
      displayName: 'Publish JUnit Test Results'
      condition: always()

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/target/site/jacoco/jacoco.xml'
      displayName: 'Publish JaCoCo Coverage Report'
      condition: always()

    - task: Cache@2
      inputs:
        key: 'dependency-check | "$(Agent.OS)" | "$(Build.BuildNumber)"'
        restoreKeys: |
          dependency-check | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/dependency-check-data
      displayName: 'Cache base de datos NVD'

    - script: |
        for variable in SONATYPE_USERNAME SONATYPE_TOKEN; do
          case "${!variable}" in
            ''|'$('* )
              echo "##vso[task.logissue type=error]Configura la variable secreta $variable en Azure Pipelines."
              exit 1
              ;;
          esac
        done
        ./mvnw -B --settings .mvn/dependency-check-settings.xml \
          org.owasp:dependency-check-maven:12.1.3:check \
          -DdataDirectory="$(Pipeline.Workspace)/dependency-check-data"
      workingDirectory: backend
      displayName: 'OWASP Dependency-Check (backend)'
      env:
        NVD_API_KEY: $(NVD_API_KEY)
        SONATYPE_USERNAME: $(SONATYPE_USERNAME)
        SONATYPE_TOKEN: $(SONATYPE_TOKEN)

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/backend/target/backend-0.0.1-SNAPSHOT.jar'
        artifact: 'backend-jar'
      displayName: 'Publish Backend JAR'
      condition: succeeded()

    # SonarScanner necesita los .class y jacoco.xml en otro job.
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)/backend/target'
        artifact: 'sonar-backend'
      displayName: 'Publicar compilación y cobertura para SonarQube'
      condition: succeeded()

# ========== STAGE 2: BUILD FRONTEND ==========
- stage: BuildFrontend
  displayName: 'Build & Test Frontend'
  dependsOn: []
  jobs:
  - job: NPMBuild
    displayName: 'Angular Build & Tests'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Install Node.js'

    - script: npm ci
      workingDirectory: frontend
      displayName: 'npm install (clean)'

    - script: npm audit --audit-level=critical
      workingDirectory: frontend
      displayName: 'npm audit (dependencias, umbral crítico)'

    - script: npm test -- --watch=false --coverage
      workingDirectory: frontend
      displayName: 'npm test (Vitest + cobertura >=60%)'

    - script: npm run build
      workingDirectory: frontend
      displayName: 'npm build (production)'

    # Necesita un reporter LCOV activado en las pruebas Angular/Vitest.
    - script: |
        LCOV_FILE="$(find "$(Build.SourcesDirectory)/frontend" \
          -type f -name lcov.info \
          -not -path '*/node_modules/*' \
          -print -quit)"
        if [ -z "$LCOV_FILE" ]; then
          echo '##vso[task.logissue type=error]No se ha generado lcov.info. Habilita el reporter LCOV en Angular/Vitest.'
          exit 1
        fi
        mkdir -p "$(Build.ArtifactStagingDirectory)/sonar-frontend"
        # SF:src/... es relativo al directorio frontend; Sonar analiza desde la raíz del repo.
        sed -e 's|^SF:src/|SF:frontend/src/|' \
            -e 's|^SF:\./src/|SF:frontend/src/|' \
            "$LCOV_FILE" > "$(Build.ArtifactStagingDirectory)/sonar-frontend/lcov.info"
      displayName: 'Preparar cobertura Angular para SonarQube'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/sonar-frontend'
        artifact: 'sonar-frontend'
      displayName: 'Publicar cobertura Angular'
      condition: succeeded()

# ========== STAGE 3: ESCÁNER DE SECRETOS ==========
- stage: SecretScan
  displayName: 'Secret Scan'
  dependsOn: []
  jobs:
  - job: Gitleaks
    displayName: 'Gitleaks'
    steps:
    - script: |
        docker run --rm -v "$(Build.SourcesDirectory):/repo" \
          ghcr.io/gitleaks/gitleaks:v8.24.3 detect --source /repo --no-git --redact --verbose
      displayName: 'Gitleaks (secretos en el repositorio)'

# ========== STAGE 4: SONARQUBE ==========
- stage: Sonarqube
  displayName: 'SonarQube - Backend y Frontend'
  dependsOn: [BuildBackend, BuildFrontend, SecretScan]

  # Analizar los pushes a main y develop. Los PR se validan mediante
  # compilación, tests y escaneo de secretos, sin actualizar SonarQube.
  condition: |
    and(
      succeeded(),
      or(
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        eq(variables['Build.SourceBranch'], 'refs/heads/develop')
      )
    )

  jobs:
  # --- Proyecto SonarQube: Backend (Java + JaCoCo) ---
  - job: SonarBackend
    displayName: 'Analizar Backend'
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'sonar-backend'
        targetPath: '$(Build.SourcesDirectory)/backend/target'
      displayName: 'Descargar clases Java y JaCoCo'

    - script: |
        set -e
        test -d backend/target/classes || { echo 'Faltan las clases Java compiladas'; exit 1; }
        test -s backend/target/site/jacoco/jacoco.xml || { echo 'Falta jacoco.xml'; exit 1; }

        if command -v sonar-scanner >/dev/null 2>&1; then
          SCANNER="$(command -v sonar-scanner)"
        elif [ -x /opt/sonar-scanner/bin/sonar-scanner ]; then
          SCANNER=/opt/sonar-scanner/bin/sonar-scanner
        else
          echo '##vso[task.logissue type=error]SonarScanner no está instalado en el agente WSL.'
          exit 1
        fi

        if [ -z "$SONAR_PROJECT_KEY" ] || [[ "$SONAR_PROJECT_KEY" == '$('* ]]; then
          echo '##vso[task.logissue type=error]Configura SONAR_BACKEND_PROJECT_KEY con la clave real del proyecto Backend.'
          exit 1
        fi

        "$SCANNER" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.projectName='ESIBuy - Backend' \
          -Dsonar.sources=backend/src/main \
          -Dsonar.tests=backend/src/test \
          -Dsonar.java.binaries=backend/target/classes \
          -Dsonar.java.test.binaries=backend/target/test-classes \
          -Dsonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml \
          -Dsonar.qualitygate.wait=true
      displayName: 'Ejecutar análisis SonarQube Backend'
      env:
        SONAR_PROJECT_KEY: $(SONAR_BACKEND_PROJECT_KEY)
        SONAR_TOKEN: $(SQ_TOKEN)
        SONAR_HOST_URL: $(SONAR_HOST_URL)

  # --- Proyecto SonarQube: Frontend (Angular + LCOV) ---
  - job: SonarFrontend
    displayName: 'Analizar Frontend'
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: DownloadPipelineArtifact@2
      inputs:
        buildType: 'current'
        artifactName: 'sonar-frontend'
        targetPath: '$(Build.SourcesDirectory)/frontend/coverage'
      displayName: 'Descargar cobertura LCOV'

    - task: NodeTool@0
      inputs:
        versionSpec: $(NODE_VERSION)
      displayName: 'Preparar Node.js para análisis Angular'

    - script: |
        set -e
        test -s frontend/coverage/lcov.info || { echo 'Falta lcov.info'; exit 1; }

        if command -v sonar-scanner >/dev/null 2>&1; then
          SCANNER="$(command -v sonar-scanner)"
        elif [ -x /opt/sonar-scanner/bin/sonar-scanner ]; then
          SCANNER=/opt/sonar-scanner/bin/sonar-scanner
        else
          echo '##vso[task.logissue type=error]SonarScanner no está instalado en el agente WSL.'
          exit 1
        fi

        if [ -z "$SONAR_PROJECT_KEY" ] || [[ "$SONAR_PROJECT_KEY" == '$('* ]]; then
          echo '##vso[task.logissue type=error]Configura SONAR_FRONTEND_PROJECT_KEY con la clave real del proyecto Frontend.'
          exit 1
        fi

        "$SCANNER" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.projectName='ESIBuy - Frontend' \
          -Dsonar.sources=frontend/src \
          -Dsonar.tests=frontend/src \
          '-Dsonar.test.inclusions=frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts' \
          '-Dsonar.exclusions=frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts' \
          -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info \
          -Dsonar.qualitygate.wait=true
      displayName: 'Ejecutar análisis SonarQube Frontend'
      env:
        SONAR_PROJECT_KEY: $(SONAR_FRONTEND_PROJECT_KEY)
        SONAR_TOKEN: $(SQ_TOKEN)
        SONAR_HOST_URL: $(SONAR_HOST_URL)

# ========== FINAL NOTIFICATION ==========
- stage: Notification
  displayName: 'Pipeline Complete'
  dependsOn: [BuildBackend, BuildFrontend, SecretScan, Sonarqube]
  condition: always()
  jobs:
  - job: NotifyOk
    displayName: 'Pipeline OK'
    condition: |
      and(
        eq(stageDependencies.BuildBackend.MavenBuild.result, 'Succeeded'),
        eq(stageDependencies.BuildFrontend.NPMBuild.result, 'Succeeded'),
        eq(stageDependencies.SecretScan.Gitleaks.result, 'Succeeded'),
        or(
          and(
            eq(stageDependencies.Sonarqube.SonarBackend.result, 'Succeeded'),
            eq(stageDependencies.Sonarqube.SonarFrontend.result, 'Succeeded')
          ),
          eq(variables['Build.Reason'], 'PullRequest')
        )
      )
    steps:
    - script: echo '##[section]PIPELINE PASSED - All applicable checks green'
      displayName: 'Summary'

  - job: NotifyFail
    displayName: 'Pipeline FAILED'
    condition: |
      not(
        and(
          eq(stageDependencies.BuildBackend.MavenBuild.result, 'Succeeded'),
          eq(stageDependencies.BuildFrontend.NPMBuild.result, 'Succeeded'),
          eq(stageDependencies.SecretScan.Gitleaks.result, 'Succeeded'),
          or(
            and(
              eq(stageDependencies.Sonarqube.SonarBackend.result, 'Succeeded'),
              eq(stageDependencies.Sonarqube.SonarFrontend.result, 'Succeeded')
            ),
            eq(variables['Build.Reason'], 'PullRequest')
          )
        )
      )
    steps:
    - script: echo '##[error]PIPELINE FAILED - See logs above'
      displayName: 'Summary'
